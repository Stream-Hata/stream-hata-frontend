<div class="jk-page feedback-page">
	<header class="jk-page-header">
		<div class="jk-page-header-text">
			<h1 class="jk-h1">Обратная связь</h1>
			<p class="jk-caption">
				Баг, предложение или отзыв. Баги и предложения создают issue в GitHub.
			</p>
		</div>
	</header>

	<section class="jk-card feedback-form">
		<label>
			<span class="jk-label">Что сломалось / где проблема</span>
			<tui-textfield tuiChevron>
				<input [readonly]="true" tuiInput tuiSelectLike [value]="areaLabel()" />
				<tui-data-list-wrapper
					*tuiDropdown
					[items]="areaLabels"
					(itemClick)="setArea($event)"
				></tui-data-list-wrapper>
			</tui-textfield>
		</label>
		<label>
			<span class="jk-label">Тип обращения</span>
			<tui-textfield tuiChevron>
				<input [readonly]="true" tuiInput tuiSelectLike [value]="kindLabel()" />
				<tui-data-list-wrapper
					*tuiDropdown
					[items]="kindLabels"
					(itemClick)="setKind($event)"
				></tui-data-list-wrapper>
			</tui-textfield>
		</label>
		<label>
			<span class="jk-label">Причина</span>
			<tui-textfield tuiChevron>
				<input
					tuiInput
					tuiSelectLike
					[value]="reasonQuery()"
					(input)="reasonQuery.set($any($event.target).value)"
					placeholder="Начни вводить причину…"
				/>
				<tui-data-list-wrapper
					*tuiDropdown
					[items]="filteredGroups().items"
					[labels]="filteredGroups().labels"
					(itemClick)="addReason($event)"
				></tui-data-list-wrapper>
			</tui-textfield>
		</label>
		<div class="feedback-reasons">
			@for (reason of reasons(); track reason) {
				<span class="feedback-reason-chip">
					{{ reason }}
					<button type="button" appearance="flat" size="xs" tuiButton (click)="removeReason(reason)">×</button>
				</span>
			}
			@if (customReasonVisible()) {
				<div class="feedback-custom-reason">
				<tui-textfield>
					<input
						tuiInput
						[value]="customReason()"
						(input)="customReason.set($any($event.target).value)"
						placeholder="Своя причина…"
						(keydown.enter)="addCustomReason()"
					/>
				</tui-textfield>
					<button type="button" appearance="flat" tuiButton (click)="addCustomReason()">Добавить</button>
				</div>
			}
		</div>
		<label>
			<span class="jk-label">Заголовок · {{ prefixPreview() }}</span>
			<tui-textfield
				><input tuiInput [value]="title()" (input)="title.set($any($event.target).value)"
			/></tui-textfield>
		</label>
		<label>
			<span class="jk-label">Описание</span>
			<tui-editor [formControl]="descriptionControl" />
		</label>
		<label>
			<span class="jk-label">Шаги воспроизведения</span>
			<tui-textfield>
				<textarea
					rows="4"
					tuiTextarea
					[value]="steps()"
					(input)="steps.set($any($event.target).value)"
				></textarea>
			</tui-textfield>
		</label>
		<div class="feedback-row">
			<label>
				<span class="jk-label">Ожидалось</span>
				<tui-textfield
					><input tuiInput [value]="expected()" (input)="expected.set($any($event.target).value)"
				/></tui-textfield>
			</label>
			<label>
				<span class="jk-label">Фактически</span>
				<tui-textfield
					><input tuiInput [value]="actual()" (input)="actual.set($any($event.target).value)"
				/></tui-textfield>
			</label>
		</div>
		<div class="feedback-row">
			<label>
				<span class="jk-label">Версия</span>
				<tui-textfield
					><input
						tuiInput
						[value]="version()"
						(input)="version.set($any($event.target).value)"
						placeholder="0.8.4"
				/></tui-textfield>
			</label>
			<label>
				<span class="jk-label">Контакт</span>
				<tui-textfield
					><input
						tuiInput
						[value]="contact()"
						(input)="contact.set($any($event.target).value)"
						placeholder="Discord / Telegram"
				/></tui-textfield>
			</label>
		</div>
		<label class="feedback-honeypot">
			<span>Website</span>
			<input
				[value]="website()"
				(input)="website.set($any($event.target).value)"
				tabindex="-1"
				autocomplete="off"
			/>
		</label>

		@if (error()) {
			<p class="error-text">{{ error() }}</p>
		}
		@if (result()) {
			<p class="feedback-success">Отправлено: {{ result() }}</p>
		}

		<button type="button" appearance="primary" tuiButton [disabled]="sending()" (click)="submit()">
			{{ sending() ? 'Отправка…' : 'Отправить' }}
		</button>
	</section>
</div>
