@if (visible()) {
<app-roulette-stage
  [appearance]="state().config.appearance"
  [audio]="state().config.audio"
  [audioEnabled]="true"
  [filler]="filler()"
  [interactive]="false"
  [mode]="state().config.mode"
  [reveal]="state().config.reveal"
  [round]="round()"
  [spinning]="spinning()"
  />
}
