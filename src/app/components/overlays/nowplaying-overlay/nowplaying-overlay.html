<div class="overlay-stage">
  <article class="nowplaying-card">
    <span class="nowplaying-kicker">СЕЙЧАС ИГРАЕТ</span>
    @if (current(); as track) {
      @if (videoUrl(); as video) {
        <iframe
          #player
          class="nowplaying-video"
          [class.nowplaying-video-hidden]="!showVideo()"
          [src]="video"
          title="Now playing"
          allow="autoplay; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
          (load)="onVideoLoad($event)"
        ></iframe>
      }
      @if (!showVideo() && thumbnailUrl() && !thumbnailFailed()) {
        <img
          class="nowplaying-cover"
          [alt]="track.title"
          [src]="thumbnailUrl()"
          (error)="thumbnailFailed.set(true)"
        />
      } @else if (!showVideo()) {
        <span class="nowplaying-cover nowplaying-cover-empty" aria-hidden="true">♪</span>
      }
      @if (needsGesture()) {
        <button class="nowplaying-play" type="button" (click)="resumePlayback()">
          ▶ Включить звук
        </button>
      }
      <strong class="nowplaying-title">{{ track.title }}</strong>
      <span class="nowplaying-author">{{ track.author }} · {{ duration() }}</span>
      <button class="nowplaying-skip" type="button" (click)="skipTrack()">
        Пропустить трек →
      </button>
    } @else {
      <span class="jk-caption">Трек-лист пуст</span>
    }
  </article>
</div>
