<div class="dice-stage">
  <div class="dice-card" [class.rolling]="rolling()">
    <span class="dice-kicker">DICE</span>

    <div class="dice-scene" [style.perspective.px]="900">
      @if (sides() === 6) {
        <div class="dice-cube" [style.transform]="rolling() ? null : cubeTransform()">
          <div class="dice-face face-front"><span>{{ faceValue(1) }}</span></div>
          <div class="dice-face face-back"><span>{{ faceValue(2) }}</span></div>
          <div class="dice-face face-right"><span>{{ faceValue(3) }}</span></div>
          <div class="dice-face face-left"><span>{{ faceValue(4) }}</span></div>
          <div class="dice-face face-top"><span>{{ faceValue(5) }}</span></div>
          <div class="dice-face face-bottom"><span>{{ faceValue(6) }}</span></div>
        </div>
      } @else {
        <div class="dice-poly" [class.rolling]="rolling()" [style.transform]="rolling() ? null : polyTransform()">
          <svg viewBox="0 0 200 200" role="img" [attr.aria-label]="formula()">
            <defs>
              <linearGradient id="dicePolyFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="rgb(70 36 86)" />
                <stop offset="55%" stop-color="rgb(30 18 42)" />
                <stop offset="100%" stop-color="rgb(15 8 23)" />
              </linearGradient>
            </defs>
            <polygon class="poly-back" [attr.points]="polygonPoints()" transform="translate(-10 10)" />
            @for (facet of facetShades(); track $index) {
              <polygon class="poly-shade" [attr.points]="facet" [attr.data-even]="$index % 2 === 0" />
            }
            <polygon class="poly-body" [attr.points]="polygonPoints()" />
            <g class="poly-facets">
              @for (point of facetLines(); track $index) {
                <line x1="100" y1="100" [attr.x2]="point.x" [attr.y2]="point.y" />
              }
            </g>
            <text class="poly-result" x="100" y="112">{{ result() }}</text>
          </svg>
        </div>
      }
      @if (showOverflow()) {
        <strong class="dice-overflow">{{ result() }}</strong>
      }
    </div>

    <strong class="dice-formula">{{ formula() }}</strong>
    @if (rolls().length > 1) {
      <span class="dice-rolls">{{ rolls().join(' + ') }}</span>
    }
    @if (viewer()) {
      <span class="dice-viewer">{{ viewer() }}</span>
    }
  </div>
</div>
