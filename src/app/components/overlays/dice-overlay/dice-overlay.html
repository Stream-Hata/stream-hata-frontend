<div class="dice-stage">
  <div class="dice-card" [class.visible]="visible()" [class.rolling]="rolling()">
    <span class="dice-kicker">DICE</span>
    <div #diceHost class="dice-host"></div>
    @if (!sceneReady()) {
      <div class="dice-fallback" [class.rolling]="rolling()">
        <div class="fallback-cube">
          <span class="fallback-face f-front">{{ result() }}</span>
          <span class="fallback-face f-back">{{ result() }}</span>
          <span class="fallback-face f-right">{{ result() }}</span>
          <span class="fallback-face f-left">{{ result() }}</span>
          <span class="fallback-face f-top">{{ result() }}</span>
          <span class="fallback-face f-bottom">{{ result() }}</span>
        </div>
      </div>
    }
    @if (sides() > 20) {
      <strong class="dice-result">{{ result() }}</strong>
    }
    <strong class="dice-formula">{{ formula() }}</strong>
    @if (rolls().length > 1) {
      <span class="dice-rolls">{{ rolls().join(' + ') }}</span>
    }
    @if (viewer()) {
      <span class="dice-viewer">{{ viewer() }}</span>
    }
  </div>
</div>
