name: Deploy admin

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_HOST: ${{ secrets.STREAMHATA_PRIMARY_HOST || secrets.STREAMHATA_SSH_HOST }}
      SSH_PORT: ${{ secrets.STREAMHATA_SSH_PORT }}
      SSH_USER: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm build:admin

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.STREAMHATA_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_HOST:-}"
          test -n "${SSH_KEY:-}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: Deploy admin
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          rsync -az --delete -e "ssh -p $port -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/streamhata-admin/browser/ "$SSH_USER@$ADMIN_HOST:/var/www/streamhata-admin/"
          ssh -p "$port" -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$ADMIN_HOST" \
            'sudo -n nginx -t && sudo -n systemctl reload nginx'
