name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 0.2.0). Пусто = версия из тега/package.json'
        required: false
        default: ''
      draft:
        description: 'Создать черновик релиза'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: 'appimage,deb,rpm'
            artifact: 'rgg-inventory-linux'
          - os: windows-latest
            bundles: 'nsis'
            artifact: 'rgg-inventory-windows'
          - os: macos-latest
            bundles: 'dmg'
            artifact: 'rgg-inventory-macos'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.2.0")
          fi
          # без ведущей 'v'
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: List bundles
        run: find bundles -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            bundles/**/*.AppImage
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*-setup.exe
            bundles/**/*.dmg
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true

      - name: Generate server manifest
        id: manifest
        run: node scripts/make-manifest.mjs bundles "${{ steps.ver.outputs.version }}"

      - name: Upload bundles to server
        if: ${{ env.DEPLOY_KEY != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519"
          scp -r bundles/* "$DEPLOY_USER@$DEPLOY_HOST:/var/www/rgg-inv-downloads/"
          scp bundles/latest.json "$DEPLOY_USER@$DEPLOY_HOST:/var/www/rgg-inv-downloads/latest.json"

      - name: Fix server file permissions
        if: ${{ env.DEPLOY_KEY != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "chown -R www-data:www-data /var/www/rgg-inv-downloads && chmod -R a+rX /var/www/rgg-inv-downloads"
