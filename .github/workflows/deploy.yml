name: Deploy frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'angular.json'
      - 'index.html'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRIMARY_HOST: ${{ secrets.STREAMHATA_PRIMARY_HOST || secrets.STREAMHATA_SSH_HOST }}
      SECONDARY_HOST: ${{ secrets.STREAMHATA_SECONDARY_HOST || secrets.STREAMHATA_SSH_HOST_SECONDARY }}
      SSH_PORT: ${{ secrets.STREAMHATA_SSH_PORT }}
      SSH_USER: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build
        run: |
          set +e
          pnpm build > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E "ERROR|error TS|NG[0-9]+|FAILED|failed" build.log | tail -40 | while IFS= read -r line; do
              echo "::error title=Web build::$line"
            done
            tail -40 build.log
          fi
          exit "$status"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.STREAMHATA_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIMARY_HOST:-}" ]; then
            echo "::error title=Deploy config::STREAMHATA_PRIMARY_HOST / STREAMHATA_SSH_HOST is empty"
            exit 1
          fi
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error title=Deploy config::STREAMHATA_SSH_KEY is empty"
            exit 1
          fi
          port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: Deploy primary
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          deploy() {
            rsync -az --delete -e "ssh -p $port -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              dist/nameless-streamhata/browser/ "$SSH_USER@$1:/var/www/streamhata/browser/"
            ssh -p "$port" -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$1" \
              'sudo -n nginx -t && sudo -n systemctl reload nginx'
          }

          if ! deploy "$PRIMARY_HOST"; then
            echo "::warning title=Deploy::primary host failed, falling back to streamhata.rdpctd.dev"
            PRIMARY_HOST=streamhata.rdpctd.dev
            echo "PRIMARY_HOST=$PRIMARY_HOST" >> "$GITHUB_ENV"
            deploy "$PRIMARY_HOST"
          fi

      - name: Deploy secondary
        if: ${{ env.SECONDARY_HOST != '' }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          proxy="ssh -p $port -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -W %h:%p $SSH_USER@$PRIMARY_HOST"
          rsync -az --delete -e "ssh -p $port -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand=\"$proxy\"" \
            dist/nameless-streamhata/browser/ "$SSH_USER@$SECONDARY_HOST:/var/www/streamhata/browser/"
          ssh -p "$port" -i ~/.ssh/deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="$proxy" "$SSH_USER@$SECONDARY_HOST" \
            'sudo -n nginx -t && sudo -n systemctl reload nginx'
